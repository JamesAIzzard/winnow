[project]
name = "winnow"
version = "0.1.0"
description = "Statistically robust data extraction from large language models."
authors = [
    {name = "James Izzard", email = "jamesaizzard@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "rich>=14.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-xdist>=3.6",
    "debugpy>=1.8.0",
    "ruff>=0.12.8",
    "mypy>=1.17.1",
    "pyright>=1.1.409",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnow"]

[tool.pyright]
venvPath = ".."
venv = ".venv"
typeCheckingMode = "standard"
